name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg

jobs:
  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-17

      - name: Check formatting
        run: |
          find src include tests -name '*.cpp' -o -name '*.h' | \
            xargs clang-format-17 --dry-run --Werror

  tidy:
    name: Clang-Tidy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-17 clang-tidy-17 ninja-build

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 1940ee77e81573713c0d364c42f5990172198be1

      - name: Configure
        run: cmake --preset default
        env:
          CC: clang-17
          CXX: clang++-17

      - name: Run clang-tidy
        run: |
          find src tests -name '*.cpp' | \
            xargs clang-tidy-17 -p build/debug --warnings-as-errors='bugprone-use-after-move,bugprone-dangling-handle,clang-analyzer-core.*'

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC 13
            os: ubuntu-latest
            cc: gcc-13
            cxx: g++-13
            install: sudo apt-get update && sudo apt-get install -y gcc-13 g++-13 ninja-build

          - name: Linux Clang 17
            os: ubuntu-latest
            cc: clang-17
            cxx: clang++-17
            install: sudo apt-get update && sudo apt-get install -y clang-17 ninja-build

          - name: macOS Apple Clang
            os: macos-latest
            cc: clang
            cxx: clang++
            install: brew install ninja

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: ${{ matrix.install }}

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 1940ee77e81573713c0d364c42f5990172198be1

      - name: Configure
        run: cmake --preset default
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}

      - name: Build
        run: cmake --build build/debug

      - name: Test
        run: ctest --test-dir build/debug --output-on-failure

      - name: Upload binaries
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: giodb-${{ matrix.os }}-${{ matrix.cc }}
          path: |
            build/debug/src/giodb-server
            build/debug/src/giodb-cli
          retention-days: 7
