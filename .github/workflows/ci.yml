name: CI (disabled)

# Temporarily disabled — re-enable by restoring the original `on:` triggers below.
on:
  push:
    branches: [disabled-placeholder-do-not-use]
  pull_request:
    branches: [disabled-placeholder-do-not-use]

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  LLVM_VERSION: "20"

jobs:
  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM ${{ env.LLVM_VERSION }}
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          sudo add-apt-repository -y "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-$LLVM_VERSION main"
          sudo apt-get update
          sudo apt-get install -y clang-format-$LLVM_VERSION

      - name: Check formatting
        run: |
          find src include tests -name '*.cpp' -o -name '*.h' | \
            xargs clang-format-$LLVM_VERSION --dry-run --Werror

  tidy:
    name: Clang-Tidy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM ${{ env.LLVM_VERSION }} and tools
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          sudo add-apt-repository -y "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-$LLVM_VERSION main"
          sudo apt-get update
          sudo apt-get install -y clang-$LLVM_VERSION clang-tidy-$LLVM_VERSION ninja-build

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 1940ee77e81573713c0d364c42f5990172198be1

      - name: Configure
        run: cmake --preset default
        env:
          CC: clang-${{ env.LLVM_VERSION }}
          CXX: clang++-${{ env.LLVM_VERSION }}

      - name: Run clang-tidy
        run: |
          find src tests -name '*.cpp' | \
            xargs clang-tidy-$LLVM_VERSION -p build/debug --warnings-as-errors='bugprone-use-after-move,bugprone-dangling-handle,clang-analyzer-core.*'

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC 13
            os: ubuntu-latest
            cc: gcc-13
            cxx: g++-13
            install: sudo apt-get update && sudo apt-get install -y gcc-13 g++-13 ninja-build

          - name: Linux Clang 20
            os: ubuntu-latest
            cc: clang-20
            cxx: clang++-20
            install: |
              wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
              sudo add-apt-repository -y "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-20 main"
              sudo apt-get update
              sudo apt-get install -y clang-20 ninja-build

          - name: macOS Apple Clang
            os: macos-latest
            cc: clang
            cxx: clang++
            install: brew install ninja

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: ${{ matrix.install }}

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 1940ee77e81573713c0d364c42f5990172198be1

      - name: Configure
        run: cmake --preset default
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}

      - name: Build
        run: cmake --build build/debug

      - name: Run unit tests
        run: ctest --test-dir build/debug -L unit --output-on-failure

      - name: Run QA regression tests
        run: ctest --test-dir build/debug -L qa --output-on-failure

      - name: Run integration tests
        run: ctest --test-dir build/debug -L integration --output-on-failure

      - name: Upload binaries
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: giodb-${{ matrix.os }}-${{ matrix.cc }}
          path: |
            build/debug/src/giodb-server
            build/debug/src/giodb-cli
          retention-days: 7
